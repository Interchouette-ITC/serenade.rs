[package]
name = "serenade-site"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = ["hydrate"]
hydrate = ["leptos/hydrate", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
ssr = ["leptos/ssr", "dep:serenade-view"]

[[bin]]
name = "serenade-site"
path = "src/main.rs"
required-features = ["hydrate"]

[[bin]]
name = "prerender"
path = "src/bin/prerender.rs"
required-features = ["ssr"]

[dependencies]
leptos = { workspace = true }
rangular-aot = { workspace = true }
rangular-expr = { workspace = true }
rangular-host = { workspace = true }
web-sys = { version = "0.3", optional = true, features = [
  "Window",
  "Location",
  "Document",
  "Element",
  "DomTokenList",
  "Node",
  "NodeList",
  "Navigator",
  "Clipboard",
  "EventTarget",
] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
serenade-view = { version = "1.0", optional = true, features = ["leptos-ssr"] }
anyhow = "1"

[build-dependencies]
rangular-build = { git = "https://github.com/Interchouette-ITC/rangular.git", branch = "dev" }
